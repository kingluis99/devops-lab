spring:
  application:
    name: task-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:tasks;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

app:
  build-version: ${APP_BUILD_VERSION:dev}
  environment: ${APP_ENVIRONMENT:local}

logging:
  level:
    root: INFO
